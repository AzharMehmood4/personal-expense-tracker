<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>

  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <div class="app">

    <header>
      <h1>Expense Tracker</h1>
      <p>Track your daily expenses smartly</p>
    </header>

   <!-- Form -->
    <div class="card">

      <form id="expenseForm">

        <div class="grid">
          <div>
            <label>Title</label>
            <input type="text" id="title" placeholder="e.g. Lunch"/>
            <small id="titleError"></small>
          </div>

          <div>
            <label>Amount</label>
            <input type="number" id="amount" placeholder="e.g. 500"/>
            <small id="amountError"></small>
          </div>

          <div>
            <label>Category</label>
            <select id="category">
              <option value="">Select</option>
              <option>Food</option>
              <option>Transport</option>
              <option>Utilities</option>
              <option>Entertainment</option>
            </select>
            <small id="categoryError"></small>
          </div>
        </div>

        <button type="submit" id="submitBtn">Add Expense</button>
      </form>

    </div>

    <!-- CONTROLS -->
    <div class="controls">

      <select id="filterCategory">
        <option value="All">All Categories</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Utilities</option>
        <option>Entertainment</option>
      </select>

      <button id="sortAsc">Sort Ascending</button>
      <button id="sortDesc">Sort Descending</button>

    </div>

    <div class="card table-card">

      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="expenseTableBody"></tbody>
      </table>

    </div>
    
    <!-- cate Sumary -->
    <div class="summary">

      <div class="total-card">
        <h2>Total</h2>
        <h3 id="total">PKR 0</h3>
      </div>

      <div id="categoryTotals"></div>

    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
